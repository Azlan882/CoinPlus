name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Java JDK 21 (Required by Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          echo "Configuring Android SDK at $ANDROID_HOME..."
          
          # Add SDK commandline tools and platform-tools to path
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
          fi

          # 1. Pre-seed all standard SHA-1 license hashes into the licenses directory
          mkdir -p "$ANDROID_HOME/licenses"

          # android-sdk-license (all historical and modern revisions)
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6824ea7279bf83f126be9ee6178e8\n" > "$ANDROID_HOME/licenses/android-sdk-license"

          # android-sdk-preview-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

          # android-googletv-license
          printf "601085b94cd77f0b54ff86406957099fed7926c4\nd97543802996754ba520286242e8cf6f168a8c60\n" > "$ANDROID_HOME/licenses/android-googletv-license"

          # android-sdk-arm-dbt-license
          printf "859f317696e351857647822304914cedf83f2f67\n" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"

          # google-gdk-license
          printf "33b6a2b64f07944f47e583e47ab61d03d952e6d5\n" > "$ANDROID_HOME/licenses/google-gdk-license"

          # mips-android-sysimage-license
          printf "e9acab5ba5f73c61beec0084170e0ea03f2d49c8\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

          echo "Pre-seeded standard license hashes successfully."

          # 2. Run non-interactive license acceptance with pipe
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Confirming non-interactive license acceptance via $SDKMANAGER..."
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Install Android Platform & Build-Tools
        run: |
          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Installing platforms;android-36 and build-tools;36.0.0 explicitly..."
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          else
            echo "sdkmanager command not found; relying on preinstalled SDK and Gradle auto-download."
          fi

      - name: Install NPM Dependencies via package-lock.json
        run: npm ci

      - name: Build Web Application Assets
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Inspect Debug Keystore & Print SHA-1 Fingerprint
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Standard debug.keystore not present; generating standard Android debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          echo "=================================================================="
          echo "COINPULSE DEBUG APK KEYSTORE DETAILS:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android
          
          SHA1_VALUE=$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -i "SHA1:" | head -n 1 | awk '{print $2}')
          echo "=================================================================="
          echo "COINPULSE DEBUG APK SHA-1: $SHA1_VALUE"
          echo "=================================================================="

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate & Prepare Generated APK
        run: |
          echo "Listing generated APK files:"
          find android/app/build/outputs/apk -name "*.apk"
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/CoinPulse-v1.0-debug.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoinPulse-Android-APK
          path: build-output/CoinPulse-v1.0-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/CoinPulse-v1.0-debug.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## CoinPulse Android APK Release (${{ github.ref_name }})
            
            - Download `CoinPulse-v1.0-debug.apk` directly to install on your Android device.
            - Server-authoritative hourly mining with anti-cheat protection.
            - Referrals with milestone activation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
